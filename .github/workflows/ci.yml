name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package and renderer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Verify library and catalog
        run: npm test
      - name: Build renderer
        run: npm run render:build
  # TEMP-REMOVE-START
  render-previews:
    name: Render catalog previews
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build renderer
        run: npm ci && npm run render:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render previews
        run: |
          npm run render:start > renderer.log 2>&1 &
          renderer_pid=$!
          trap 'kill "$renderer_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010 > /dev/null; then break; fi
            sleep 1
          done
          for meta in themes/*.meta.json; do
            id=$(basename "$meta" .meta.json)
            THEME_ID="$id" node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          import {execFileSync} from 'node:child_process';
          import {deflateRawSync} from 'node:zlib';

          const require = createRequire(import.meta.url);
          const {validateThemePayload} = require('./dist/validation.js');
          const id = process.env.THEME_ID;
          const metadata = JSON.parse(readFileSync(`themes/${id}.meta.json`, 'utf8'));
          delete metadata.$schema;
          const payload = validateThemePayload(JSON.parse(readFileSync(`themes/${id}.theme.json`, 'utf8')));
          const canonical = JSON.stringify({metadata, payload});
          const revision = process.env.GITHUB_SHA;
          execFileSync(process.execPath, ['scripts/render-submission.mjs'], {
              stdio: 'inherit',
              env: {
                  ...process.env,
                  SUBMISSION: deflateRawSync(Buffer.from(canonical)).toString('base64'),
                  JOB_ID: '00000000-0000-0000-0000-000000000000',
                  USER_ID: '1',
                  THEME_HASH: createHash('sha256').update(canonical).digest('hex'),
                  RENDERER_REVISION: revision,
              },
          });
          const result = JSON.parse(readFileSync('output/result.json', 'utf8'));
          for (const mode of ['light', 'dark']) {
              writeFileSync(`previews/${id}-${mode}.png`, Buffer.from(result.files[mode], 'base64'));
          }
          JS
          done
      - name: Upload previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-previews
          path: previews/*.png
          if-no-files-found: error
          retention-days: 1
  # TEMP-REMOVE-END
